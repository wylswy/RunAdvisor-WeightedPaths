name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: mvn test
    runs-on: ubuntu-latest
    env:
      STS_GAME_JAR_URL: ${{ secrets.STS_GAME_JAR_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Fetch game jar
        if: env.STS_GAME_JAR_URL != ''
        run: curl -fsSL "$STS_GAME_JAR_URL" -o lib/desktop-1.0.jar
      - name: Run tests
        if: env.STS_GAME_JAR_URL != ''
        run: mvn -B test
      - name: Notice when game jar unavailable
        if: env.STS_GAME_JAR_URL == ''
        run: echo "::notice::未配置 STS_GAME_JAR_URL secret，跳过游戏依赖测试。配置方法：将 desktop-1.0.jar 上传到任意私有 URL，在仓库 Settings -> Secrets 添加同名 secret。"